<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4ae8">
<title>My To-Do</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%236d5dfc'/><path d='M18 33l9 9 19-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{--bg:#f4f3f8;--side:#fbfafd;--panel:#f6f5fa;--card:rgba(255,255,255,.96);--card-h:#fff;--solid:#fff;--text:#1d1b2e;--muted:#6f6c85;--line:#e6e4ef;--hover:rgba(80,70,160,.07);--sel:rgba(109,93,252,.13);--accent:#5b4ae8;--danger:#d13438;--menu:#fff;--shadow:0 1px 2px rgba(20,16,50,.08),0 1px 6px rgba(20,16,50,.05);color-scheme:light}
[data-theme=dark]{--bg:#16151d;--side:#1b1a24;--panel:#1d1c27;--card:rgba(38,36,52,.95);--card-h:#2d2b42;--solid:#25233a;--text:#ecebf5;--muted:#9c99b5;--line:#2f2d40;--hover:rgba(255,255,255,.06);--sel:rgba(140,125,255,.2);--accent:#a397ff;--danger:#ff6b6e;--menu:#262438;--shadow:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
.ic{width:18px;height:18px;flex-shrink:0}
.app{display:flex;height:100vh;height:100dvh}
.toasts{padding-bottom:env(safe-area-inset-bottom)}

/* sidebar */
#sidebar{width:272px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.app.side-hidden #sidebar{display:none}
.side-top{padding:12px 12px 6px;display:flex;gap:6px;align-items:center}
.searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:34px;color:var(--muted)}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox input{flex:1;width:100%;border:0;background:none;outline:0;min-width:0;color:var(--text)}
#nav{flex:1;overflow:auto;padding:4px 8px 8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:7px;cursor:pointer;user-select:none}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--sel);font-weight:600}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-size:12px;color:var(--muted);font-weight:400}
.nav-item .emo{width:18px;text-align:center;font-size:15px;line-height:18px}
.nav-item.i-myday .ic{color:#e3a008}.nav-item.i-important .ic{color:#d9487a}.nav-item.i-planned .ic{color:#1f8a8a}.nav-item.i-all .ic{color:#5b6b8f}.nav-item.i-completed .ic{color:#2f8f5b}.nav-item.i-tasks .ic{color:#6d5dfc}.nav-item.i-list .ic{color:var(--accent)}
.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.group-h{display:flex;align-items:center;gap:8px;padding:7px 10px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;border-radius:7px;user-select:none}
.group-h:hover{background:var(--hover)}
.group-h .chev{transition:transform .15s;width:14px;height:14px}
.group-h.closed .chev{transform:rotate(-90deg)}
.group-body{padding-left:16px}
.group-empty{font-size:12px;color:var(--muted);padding:4px 10px 6px}
.side-foot{display:flex;gap:4px;padding:8px;border-top:1px solid var(--line)}
.newlist{flex:1;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--accent);font-weight:500}
.newlist:hover{background:var(--hover)}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:7px;color:var(--muted);flex-shrink:0}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn.sm{width:26px;height:26px}
.iconbtn.sm .ic{width:15px;height:15px}

/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--th);transition:background .3s}
.mhead{padding:18px 24px 8px;color:#fff;display:flex;align-items:flex-start;gap:8px}
.mt{min-width:0;flex:1}
.mtitle{font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px;min-width:0;text-shadow:0 1px 3px rgba(0,0,0,.18)}
.mtitle .ic{width:26px;height:26px}
.mtitle .tt{outline:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:6px;padding:0 6px;margin-left:-6px}
.mtitle .tt[contenteditable=true]{background:rgba(255,255,255,.22);overflow:visible;text-overflow:clip}
.msub{font-size:13px;opacity:.92;margin-top:2px}
.mtools{display:flex;gap:2px;flex-shrink:0}
.tbtn{display:flex;align-items:center;gap:6px;color:#fff;padding:7px 10px;border-radius:7px;font-size:13px;white-space:nowrap}
.tbtn:hover,.tbtn.on{background:rgba(255,255,255,.2)}
.sortchip{margin:0 24px 6px;align-self:flex-end;display:flex;align-items:center;gap:4px;color:#fff;font-size:12px}
.sortchip button{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px}
.sortchip button:hover{background:rgba(255,255,255,.3)}
.sortchip .ic{width:13px;height:13px}
.mbody{flex:1;overflow:auto;padding:4px 24px 32px}
.addbar{background:var(--card);border-radius:8px;box-shadow:var(--shadow);margin-bottom:10px}
.addrow{display:flex;align-items:center;gap:12px;padding:0 14px;height:50px}
.addrow .plus{color:var(--tc);display:grid}
.addrow input{flex:1;border:0;background:none;outline:0;font-size:15px;min-width:0}
.addrow input::placeholder{color:var(--tc);opacity:.95}
.addopts{display:flex;gap:4px;border-top:1px solid var(--line);padding:5px 8px;align-items:center;flex-wrap:wrap}
.chipbtn{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;color:var(--muted);font-size:12px}
.chipbtn:hover{background:var(--hover);color:var(--text)}
.chipbtn.set{color:var(--tc);background:var(--hover)}
.chipbtn .ic{width:16px;height:16px}
.addbtn{margin-left:auto;border:1px solid var(--line);padding:5px 14px;border-radius:6px;font-size:13px;font-weight:600}
.addbtn:hover{background:var(--hover)}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:9px 12px 9px 14px;margin-bottom:3px;cursor:pointer;min-height:52px;user-select:none}
.task:hover{background:var(--card-h)}
.task.sel{background:var(--card-h);box-shadow:inset 0 0 0 2px var(--tc),var(--shadow)}
.task.dragging{opacity:.35}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--tc,var(--accent));flex-shrink:0;display:grid;place-items:center;color:var(--tc,var(--accent))}
.check .ic{width:12px;height:12px;stroke-width:3;opacity:0}
.check:hover .ic{opacity:.8}
.check.on,.task.done .check{background:var(--tc,var(--accent));color:#fff}
.check.on .ic,.task.done .check .ic{opacity:1}
.check.sm{width:17px;height:17px}
.check.sm .ic{width:10px;height:10px}
.tmain{flex:1;min-width:0}
.ttitle{word-break:break-word}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;flex-wrap:wrap;gap:2px 0;font-size:12px;color:var(--muted);margin-top:1px;align-items:center}
.tmeta>span{display:inline-flex;align-items:center;gap:3px}
.tmeta>span+span::before{content:"•";margin:0 6px;color:var(--muted);opacity:.7}
.tmeta .ic{width:13px;height:13px}
.late{color:var(--danger)!important}
.tod{color:var(--accent)!important}
.cat{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;margin-right:4px}
.tdel{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--muted);flex-shrink:0;opacity:0}
.task:hover .tdel,.task.sel .tdel{opacity:1}
.tdel:hover{background:rgba(209,52,56,.12);color:var(--danger)}
.donebox{background:rgba(255,255,255,.14);border-radius:10px;margin-top:14px;overflow:hidden;backdrop-filter:blur(2px)}
.donebox .sec-h{padding:10px 12px;margin:0}
.donebox .sec-h:hover{background:rgba(255,255,255,.1)}
.donebox .sec-list{padding:0 6px 6px}
.donebox .clr{margin-left:auto;color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.18);text-shadow:none}
.donebox .clr:hover{background:rgba(209,52,56,.85)}
.dlg-b textarea{width:100%;min-height:200px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);outline:0;resize:vertical;font-size:14px}
.dlg-b textarea:focus{border-color:var(--accent)}
.bulkbtn{font-weight:600}
.star{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--muted);flex-shrink:0}
.star:hover{background:var(--hover)}
.star.on{color:var(--tc,var(--accent))}
.sec-h{display:flex;align-items:center;gap:6px;color:#fff;font-weight:600;padding:12px 4px 6px;cursor:pointer;user-select:none;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.sec-h .ic{transition:transform .15s;width:15px;height:15px}
.sec-h.closed .ic{transform:rotate(-90deg)}
.sec-h .n{opacity:.85;font-weight:400}
.empty{text-align:center;color:#fff;padding:48px 16px;text-shadow:0 1px 3px rgba(0,0,0,.2)}
.empty .big{font-size:18px;font-weight:600;margin-bottom:6px}
.empty .ic{width:56px;height:56px;opacity:.9;margin-bottom:10px}

/* detail */
#detail{width:360px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:25}
#detail[hidden]{display:none}
.dbody{flex:1;overflow:auto;padding:14px}
.dcard{background:var(--solid);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.dtrow{display:flex;align-items:flex-start;gap:12px;padding:14px 10px 10px 14px}
.dtrow .check{margin-top:5px}
.dtitle{flex:1;border:0;background:none;outline:0;resize:none;font-size:18px;font-weight:600;padding:2px 0;overflow:hidden;min-height:30px;line-height:1.35}
.dtitle.struck{text-decoration:line-through;color:var(--muted)}
.step{display:flex;align-items:center;gap:12px;padding:3px 10px 3px 16px}
.step input{flex:1;border:0;background:none;outline:0;padding:7px 0;min-width:0;border-bottom:1px solid transparent}
.step input:focus{border-bottom-color:var(--line)}
.step.done input{text-decoration:line-through;color:var(--muted)}
.step .iconbtn{opacity:0}
.step:hover .iconbtn{opacity:1}
.step.add{color:var(--accent);padding-bottom:8px}
.step.add input::placeholder{color:var(--accent)}
.step.add .plus{display:grid;width:17px}
.drow{display:flex;align-items:center;gap:14px;padding:13px 14px;cursor:pointer;color:var(--muted);min-height:48px}
.drow+.drow{border-top:1px solid var(--line)}
.drow:hover{background:var(--hover)}
.drow.set{color:var(--accent)}
.drow .lbl{flex:1;min-width:0}
.drow .sub{font-size:12px;color:var(--muted)}
.drow .x{margin-left:auto;display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--muted)}
.drow .x:hover{background:var(--hover);color:var(--text)}
.drow .x .ic{width:15px;height:15px}
.file{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.file:hover{background:var(--hover)}
.fic{width:36px;height:36px;border-radius:6px;background:var(--sel);color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:700;text-transform:uppercase;flex-shrink:0}
.fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs{font-size:12px;color:var(--muted)}
.dnote textarea{display:block;width:100%;min-height:130px;border:0;background:none;resize:vertical;outline:0;padding:12px 14px}
.dnote .upd{font-size:11px;color:var(--muted);padding:0 14px 8px}
.dback{display:none;align-items:center;gap:6px;padding:10px 14px;color:var(--accent);font-weight:600;border-bottom:1px solid var(--line);width:100%}
@media (max-width:560px){.dback{display:flex}}
.dfoot{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.sug-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:14px 4px 6px}
.sug{display:flex;align-items:center;gap:10px;background:var(--solid);border:1px solid var(--line);border-radius:8px;padding:9px 8px 9px 12px;margin-bottom:4px}
.sug .tmain{font-size:13px}
.sug-intro{padding:4px 4px 0}
.sug-intro h3{margin:4px 0}
.sug-intro p{margin:0;color:var(--muted);font-size:13px}

/* menus, dialogs, toasts */
.menu{position:fixed;background:var(--menu);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:4px;min-width:220px;z-index:200;font-size:13px}
.menu.sub{position:absolute;left:calc(100% - 4px);top:-5px;display:none;max-height:60vh;overflow:auto}
.mi:hover>.menu.sub{display:block}
.menu.flip .menu.sub{left:auto;right:calc(100% - 4px)}
.mi{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--hover)}
.mi.dis{opacity:.45;cursor:default}
.mi.danger{color:var(--danger)}
.mic{width:18px;display:grid;place-items:center;color:var(--muted)}
.mi.danger .mic{color:var(--danger)}
.ml{flex:1}
.mh{color:var(--muted);font-size:12px;margin-left:14px}
.mck{color:var(--accent);display:grid}
.mi>.ic{width:14px;height:14px;color:var(--muted)}
.msep{height:1px;background:var(--line);margin:4px 2px}
.mhdr{font-size:12px;font-weight:700;color:var(--muted);padding:6px 10px 4px;text-align:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px}
.scrim{position:fixed;inset:0;background:rgba(10,8,25,.4);display:grid;place-items:center;z-index:150;padding:16px}
.dlg{background:var(--solid);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:100%;max-width:420px;max-height:90vh;display:flex;flex-direction:column}
.dlg h3{margin:0;padding:18px 20px 6px;font-size:17px}
.dlg-b{padding:8px 20px;overflow:auto}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px}
.dlg-b input[type=text],.dlg-b input[type=date],.dlg-b input[type=datetime-local],.dlg-b input[type=number],.dlg-b select,.dlg-b input:not([type]){width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);outline:0}
.dlg-b input:focus,.dlg-b select:focus{border-color:var(--accent)}
.dlg-b p{margin:0 0 8px;color:var(--muted)}
.btn{padding:8px 16px;border-radius:7px;border:1px solid var(--line);font-weight:600}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.pri:hover,.btn.danger:hover{filter:brightness(1.08)}
.rowf{display:flex;gap:8px;align-items:center;margin:8px 0}
.days{display:flex;gap:4px;margin-top:10px}
.days label{flex:1}
.days input{display:none}
.days span{display:grid;place-items:center;height:34px;border-radius:7px;border:1px solid var(--line);cursor:pointer;font-size:12px;font-weight:600}
.days input:checked+span{background:var(--accent);color:#fff;border-color:var(--accent)}
.swrow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.swrow input{display:none}
.swrow i{display:block;width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.swrow input:checked+i{border-color:var(--text)}
.set-sec h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.set-sec h4:first-child{margin-top:4px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.set-row select{width:auto!important}
.tog{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
.tog::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tog:checked{background:var(--accent)}
.tog:checked::after{left:19px}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kbd kbd{font:12px/1 Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;justify-self:start}
.catline{display:flex;align-items:center;gap:8px;padding:4px 0}
.catline span{flex:1}
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:180;align-items:center}
.toast{background:#2b2940;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center;font-size:13px}
.toast button{color:#b9b0ff;font-weight:700}
.rems{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:190;width:320px;max-width:calc(100vw - 32px)}
.rcard{background:var(--solid);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:12px 14px;animation:pop .25s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.rcard .rh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);font-weight:700}
.rcard .rt{font-size:15px;font-weight:600;margin:4px 0 2px;word-break:break-word}
.rcard .rm{font-size:12px;color:var(--muted)}
.rcard .rb{display:flex;gap:6px;margin-top:10px}
.rcard .rb button{flex:1;padding:6px;border-radius:6px;border:1px solid var(--line);font-size:12px;font-weight:600}
.rcard .rb button:hover{background:var(--hover)}
.rcard .rb .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.side-scrim{display:none}
.syncbtn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;color:var(--muted);font-size:12px;width:100%;text-align:left}
.syncbtn:hover{background:var(--hover);color:var(--text)}
.syncbtn[hidden]{display:none}
#installBtn{white-space:nowrap;color:var(--accent);font-weight:600}
.syncbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.syncbtn.ok .dot{background:#2f9e5b}.syncbtn.syncing .dot{background:#e3a008;animation:pulse 1s infinite}.syncbtn.error .dot,.syncbtn.offline .dot{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.side-sync{padding:0 8px 4px;display:flex;gap:4px}
.authtabs{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:12px}
.authtabs label{flex:1}.authtabs input{display:none}
.authtabs span{display:block;text-align:center;padding:7px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.authtabs input:checked+span{background:var(--solid);color:var(--text);box-shadow:var(--shadow)}
.fld{margin-bottom:10px}.fld span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.err{color:var(--danger);font-size:13px;margin-top:6px}
@media (hover:none){.tdel,.step .iconbtn{opacity:1}}
@media (max-width:560px){
  .menu.sub{position:static;display:none;box-shadow:none;border:0;padding:0 0 0 18px;background:none;max-height:none;min-width:0;width:100%}
  .mi.has-sub{flex-wrap:wrap}.mi.has-sub:hover>.menu.sub{display:none}.mi.open>.menu.sub{display:block}
  .menu.root{max-height:80vh;overflow:auto;max-width:calc(100vw - 16px)}
}
.mhead .hamb{display:none}
.app.side-hidden .mhead .hamb{display:flex}

@media (max-width:1150px){#detail{position:fixed;right:0;top:0;bottom:0;box-shadow:-8px 0 30px rgba(0,0,0,.2)}}

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const dayDiff = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
const toLocalDT = d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtTime = d => d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
const DAYN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const wd = s => parseYmd(s).toLocaleDateString(undefined, {weekday:"short"});
function nextMonday(){ const d = new Date(); do d.setDate(d.getDate()+1); while (d.getDay() !== 1); return ymd(d); }
function dueLabel(s){
  const n = dayDiff(s, today());
  if (n === 0) return "Today"; if (n === 1) return "Tomorrow"; if (n === -1) return "Yesterday";
  const d = parseYmd(s), opts = {weekday:"short", day:"numeric", month:"short"};
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
}
function remLabel(dt){ const d = new Date(dt); return `${fmtTime(d)}, ${dueLabel(ymd(d))}`; }
function fmtSize(b){ return b < 1024 ? b+" B" : b < 1048576 ? (b/1024).toFixed(0)+" KB" : (b/1048576).toFixed(1)+" MB"; }
function fmtStamp(ms){ const d = new Date(ms), s = ymd(d), n = dayDiff(s, today());
  return n === 0 ? "today at "+fmtTime(d) : n === -1 ? "yesterday" : "on "+d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}); }

/* ---------- icons ---------- */
const P = {

  move:'<path d="M5 12h14M12 5l7 7-7 7"/>',
  palette:'<circle cx="13.5" cy="6.5" r="1.2"/><circle cx="17.5" cy="10.5" r="1.2"/><circle cx="8.5" cy="7.5" r="1.2"/><circle cx="6.5" cy="12.5" r="1.2"/><path d="M12 2a10 10 0 1 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 9.8C22 5.5 17.5 2 12 2z"/>',
  edit:'<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',

  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',

};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]||""}</svg>`;

/* ---------- constants ---------- */
const THEMES = {
  blue:{n:"Blue",bg:"linear-gradient(135deg,#3462c9,#5b8def)",c:"#3462c9"},
  purple:{n:"Purple",bg:"linear-gradient(135deg,#5b4ae8,#9b7bff)",c:"#5b4ae8"},
  rose:{n:"Rose",bg:"linear-gradient(135deg,#c93f6e,#f07aa0)",c:"#c93f6e"},
  red:{n:"Red",bg:"linear-gradient(135deg,#b8402f,#e8735b)",c:"#b8402f"},
  orange:{n:"Orange",bg:"linear-gradient(135deg,#c4661c,#f2a65a)",c:"#c4661c"},
  green:{n:"Green",bg:"linear-gradient(135deg,#25804f,#5bbf86)",c:"#25804f"},
  teal:{n:"Teal",bg:"linear-gradient(135deg,#167a7a,#4cc3b8)",c:"#167a7a"},
  slate:{n:"Slate",bg:"linear-gradient(135deg,#3d4760,#6b7a96)",c:"#3d4760"},
  sunset:{n:"Sunset",bg:"linear-gradient(135deg,#e2725b,#8a5cd6)",c:"#c4563f"},
  ocean:{n:"Ocean",bg:"linear-gradient(135deg,#17457f,#2fa8c9)",c:"#17457f"},
  forest:{n:"Forest",bg:"linear-gradient(135deg,#1f4535,#5b8a4a)",c:"#2c6b4a"},
  night:{n:"Night",bg:"linear-gradient(135deg,#1f1c40,#4b3f8f)",c:"#4b3f8f"}
};
const SMART = {
  myday:{name:"My Day",icon:"sun",theme:"sunset"},
  important:{name:"Important",icon:"star",theme:"rose"},
  planned:{name:"Planned",icon:"calendar",theme:"teal"},
  all:{name:"All",icon:"all",theme:"slate"},
  completed:{name:"Completed",icon:"checkc",theme:"green"}
};
const CAT_PALETTE = ["#3b82f6","#22a06b","#f08c2e","#8b5cf6","#e5484d","#e2b203","#14b8a6","#ec4899","#64748b","#a16207"];
const SORTS = {importance:"Importance",due:"Due date",myday:"Added to My Day",alpha:"Alphabetically",created:"Creation date"};
const EMOJI_RE = /^(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic}|\p{Emoji_Modifier})*)\s*/u;

/* ---------- state ---------- */
const KEY = "mytodo-v2";
let state, selId = null, panelMode = null, searchQ = "", prevView = "myday", curMenu = null, modalClose = null, drag = null;
const pending = {due:null, reminder:null, repeat:null};

function defaultState(){
  return {v:2, view:"myday", lists:[{id:"tasks",name:"Tasks",groupId:null}], groups:[], tasks:[],
    categories:[{name:"Blue category",color:"#3b82f6"},{name:"Green category",color:"#22a06b"},{name:"Orange category",color:"#f08c2e"},
      {name:"Purple category",color:"#8b5cf6"},{name:"Red category",color:"#e5484d"},{name:"Yellow category",color:"#e2b203"}],
    prefs:{}, collapsed:{}, groupClosed:{},
    settings:{theme:"system",sound:true,confirmDelete:true,addTop:true,starTop:true,notify:true,
      smart:{important:true,planned:true,all:true,completed:true,autohide:false}}};
}
function normTask(t){
  return Object.assign({id:uid(),listId:"tasks",title:"",done:false,important:false,myDay:null,myDayAt:0,due:null,reminder:null,
    reminderFired:false,repeat:null,steps:[],note:"",noteAt:0,categories:[],files:[],createdAt:Date.now(),completedAt:null,order:0}, t);
}
function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  if (!s) {
    s = defaultState();
    try {
      const old = JSON.parse(localStorage.getItem("princess-todo-v1"));
      if (Array.isArray(old)) old.forEach((o,i) => s.tasks.push(normTask({id:o.id||uid(), title:o.text||"", done:!!o.done,
        important:o.prio==="high", due:o.due||null, order:i, completedAt:o.done?Date.now():null})));
    } catch(e){}
  }
  const d = defaultState();
  s = Object.assign(d, s);
  s.settings = Object.assign(d.settings, s.settings); s.settings.smart = Object.assign(defaultState().settings.smart, s.settings.smart);
  if (!s.lists.some(l => l.id === "tasks")) s.lists.unshift({id:"tasks",name:"Tasks",groupId:null});
  s.tasks = s.tasks.map(normTask);
  s.deleted = s.deleted || {}; s.metaAt = s.metaAt || 0;
  return s;
}
let saveT;
function writeLocal(){ try { const v = state.view; if (v === "search") state.view = prevView;
  localStorage.setItem(KEY, JSON.stringify(state)); state.view = v; } catch(e){ toast("Couldn't save — storage is full."); } }
function save(){ clearTimeout(saveT); stamp(); writeLocal(); if (typeof schedulePush === "function") schedulePush(); }
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 300); }

const listById = id => state.lists.find(l => l.id === id);
const taskById = id => state.tasks.find(t => t.id === id);
function prefs(v){
  if (!state.prefs[v]) state.prefs[v] = {sort:"custom", dir:"asc", groupCat:false, showDone:true,
    theme: SMART[v] ? SMART[v].theme : v === "tasks" ? "purple" : v === "search" ? "slate" : "blue"};
  return state.prefs[v];
}
function splitEmoji(name){ const m = name.match(EMOJI_RE); return m ? {emo:m[1], text:name.slice(m[0].length)||name} : {emo:null, text:name}; }
function viewInfo(v){
  if (SMART[v]) return {name:SMART[v].name, icon:SMART[v].icon, smart:true};
  if (v === "search") return {name:`Searching for “${searchQ}”`, icon:"search", smart:true};
  const l = listById(v); if (!l) return {name:"", icon:"list"};
  const s = splitEmoji(l.name);
  return {name:s.text, emo:s.emo, icon:v === "tasks" ? "home" : "list", list:l, custom:v !== "tasks"};
}
function viewTasks(v){
  const T = state.tasks, t0 = today();
  switch (v) {
    case "myday": return T.filter(t => t.myDay === t0);
    case "important": return T.filter(t => t.important);
    case "planned": return T.filter(t => t.due || t.reminder);
    case "all": return T.slice();
    case "completed": return T.filter(t => t.done);
    case "search": { const q = searchQ.trim().toLowerCase(); if (!q) return [];
      return T.filter(t => [t.title, t.note, ...t.steps.map(s => s.title), ...t.categories, (listById(t.listId)||{}).name].join(" ").toLowerCase().includes(q)); }
    default: return T.filter(t => t.listId === v);
  }
}
function countOpen(v){ return v === "completed" ? "" : viewTasks(v).filter(t => !t.done).length || ""; }
function sortTasks(a, p){
  const dir = p.dir === "desc" ? -1 : 1, dk = t => t.due || "9999-99-99";
  const C = {
    importance: (x,y) => (y.important - x.important) || (x.order - y.order),
    due: (x,y) => dk(x) < dk(y) ? -1 : dk(x) > dk(y) ? 1 : x.order - y.order,
    alpha: (x,y) => x.title.localeCompare(y.title, undefined, {sensitivity:"base", numeric:true}),
    created: (x,y) => x.createdAt - y.createdAt,
    myday: (x,y) => (x.myDayAt||0) - (y.myDayAt||0)
  }[p.sort];
  if (!C) { const r = a.slice().sort((x,y) => x.order - y.order);
    return state.settings.starTop ? r.filter(t => t.important).concat(r.filter(t => !t.important)) : r; }
  return a.slice().sort((x,y) => C(x,y) * dir);
}
const canDragSort = v => { const p = prefs(v); return p.sort === "custom" && !p.groupCat && !["planned","completed","search"].includes(v); };

/* ---------- task operations ---------- */
function newOrder(){ const o = state.tasks.map(t => t.order); return state.settings.addTop ? Math.min(0, ...o) - 1 : Math.max(0, ...o) + 1; }
function addTask(title){
  const v = state.view, t = normTask({title, createdAt:Date.now(), order:newOrder()});
  if (listById(v)) t.listId = v;
  if (v === "myday") { t.myDay = today(); t.myDayAt = Date.now(); }
  if (v === "important") t.important = true;
  if (v === "planned") t.due = today();
  if (pending.due) t.due = pending.due;
  if (pending.reminder) t.reminder = pending.reminder;
  if (pending.repeat) { t.repeat = pending.repeat; if (!t.due) t.due = today(); }
  pending.due = pending.reminder = pending.repeat = null;
  state.tasks.push(t); save(); return t;
}
const isClosed = k => state.collapsed[k] ?? /:done$/.test(k);
const cleanLine = l => l.replace(/^\s*(?:[-*•▪◦]|\d+[.)]|\[[ xX]?\])\s*/, "").trim();
function bulkAdd(text){
  const lines = text.split(/\r?\n/).map(cleanLine).filter(Boolean).map(l => l.slice(0, 255));
  if (!lines.length) return 0;
  const opts = {...pending};
  (state.settings.addTop ? lines.slice().reverse() : lines).forEach(l => { Object.assign(pending, opts); addTask(l); });
  renderAll(); toast(`Added ${lines.length} task${lines.length > 1 ? "s" : ""}`);
  return lines.length;
}
async function bulkDialog(init){
  const f = await dialog("Add many tasks", `<p>Type or paste one task per line. Bullets and numbers are removed automatically.</p><textarea name="v" placeholder="Buy groceries\nCall mum\nFinish DSA report">${esc(init)}</textarea>`,
    {ok:"Add tasks", mount: f => { const ta = f.elements.v, btn = f.querySelector(".btn.pri");
      const upd = () => { const n = ta.value.split(/\r?\n/).map(cleanLine).filter(Boolean).length; btn.textContent = n ? `Add ${n} task${n > 1 ? "s" : ""}` : "Add tasks"; };
      ta.addEventListener("input", upd); upd(); setTimeout(() => ta.focus(), 40);
      ta.addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) { e.preventDefault(); f.requestSubmit(); } }); }});
  if (f) bulkAdd(f.v.value);
}
async function deleteCompleted(list){
  if (!list.length) return;
  if (!(await confirmDlg(`${list.length} completed task${list.length > 1 ? "s" : ""} will be permanently deleted.`, "Delete completed tasks"))) return;
  const ids = new Set(list.map(t => t.id)), before = state.tasks.slice();
  state.tasks = state.tasks.filter(t => !ids.has(t.id)); if (ids.has(selId)) selId = null;
  save(); renderAll();
  toast(`Deleted ${list.length} task${list.length > 1 ? "s" : ""}`, "Undo", () => { state.tasks = before; save(); renderAll(); }, 7000);
}
function toggleDone(t){
  if (!t) return;
  if (!t.done) {
    t.done = true; t.completedAt = Date.now();
    if (state.settings.sound) ding();
    if (t.repeat) {
      const base = t.due || today(), nd = nextDate(base, t.repeat), shift = dayDiff(nd, base);
      const n = normTask(JSON.parse(JSON.stringify(t)));
      Object.assign(n, {id:uid(), done:false, completedAt:null, due:nd, myDay:null, reminderFired:false, createdAt:Date.now(),
        steps:n.steps.map(s => ({...s, id:uid(), done:false}))});
      if (t.reminder) { const r = new Date(t.reminder); r.setDate(r.getDate() + shift); n.reminder = toLocalDT(r); }
      t.repeat = null; state.tasks.push(n);

function toggleMyDay(t){ if (t.myDay === today()) t.myDay = null; else { t.myDay = today(); t.myDayAt = Date.now(); } save(); renderAll(); }
function toggleImp(t){ t.important = !t.important; save(); renderAll(); }
function setDue(t, d){ t.due = d; if (!d) t.repeat = null; save(); renderAll(); }
function setReminder(t, r){ t.reminder = r; t.reminderFired = false; if (r) ensureNotify(); save(); renderAll(); }
function setRepeat(t, r){ t.repeat = r; if (r && !t.due) t.due = today(); save(); renderAll(); }
async function deleteTask(t){
  if (state.settings.confirmDelete && !(await confirmDlg(`“${t.title}” will be permanently deleted.`, "Delete task"))) return;
  const i = state.tasks.indexOf(t); state.tasks.splice(i, 1);
  if (selId === t.id) selId = null;
  save(); renderAll();
  toast("Task deleted", "Undo", () => { state.tasks.splice(i, 0, t); save(); renderAll(); });
}
function nextDate(d, r){
  const dt = parseYmd(d), iv = Math.max(1, r.interval || 1);
  switch (r.type) {
    case "daily": dt.setDate(dt.getDate() + iv); break;
    case "weekdays": do dt.setDate(dt.getDate() + 1); while (dt.getDay() === 0 || dt.getDay() === 6); break;
    case "weekly":
      if (r.days && r.days.length) { let g = 0;
        do { dt.setDate(dt.getDate() + 1); if (dt.getDay() === 0 && iv > 1) dt.setDate(dt.getDate() + 7*(iv-1)); g++; }
        while (!r.days.includes(dt.getDay()) && g < 400);
      } else dt.setDate(dt.getDate() + 7*iv);
      break;
    case "monthly": { const day = dt.getDate(); dt.setDate(1); dt.setMonth(dt.getMonth() + iv);
      dt.setDate(Math.min(day, new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate())); break; }
    case "yearly": dt.setFullYear(dt.getFullYear() + iv); break;
  }
  return ymd(dt);
}
function repeatLabel(r){
  const iv = r.interval || 1, base = {daily:"Daily",weekdays:"Weekdays",weekly:"Weekly",monthly:"Monthly",yearly:"Yearly"}[r.type];
  const unit = {daily:"day",weekly:"week",monthly:"month",yearly:"year"}[r.type];
  let s = iv > 1 && unit ? `Every ${iv} ${unit}s` : base;
  if (r.type === "weekly" && r.days && r.days.length) s += " on " + r.days.slice().sort().map(d => DAYN[d]).join(", ");
  return s;
}

let dbp;
function db(){ return dbp ||= new Promise((res, rej) => { const r = indexedDB.open("mytodo-files", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("files"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function fop(mode, fn){ const d = await db(); return new Promise((res, rej) => { const tx = d.transaction("files", mode), st = tx.objectStore("files");
  const rq = fn(st); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); }); }
const fput = (id, b) => fop("readwrite", s => s.put(b, id));

async function fgc(){ try { const keys = await fop("readonly", s => s.getAllKeys()); const used = new Set(state.tasks.flatMap(t => t.files.map(f => f.id)));
  for (const k of keys) if (!used.has(k)) await fdel(k); } catch(e){} }
async function addFiles(t, files){

    const id = uid();
    try { await fput(id, f); const rec = {id, name:f.name, size:f.size, type:f.type}; t.files.push(rec); uploadFile(rec, f); }
    catch(e){ toast("Couldn't attach " + f.name); }

  if (!b && sb && user) { toast("Downloading " + f.name + "…"); const r = await sb.storage.from("todo-files").download(`${user.id}/${f.id}`); if (r.data) { b = r.data; fput(f.id, b).catch(() => {}); } }
  if (!b) return toast(user ? "File not found" : "Sign in to sync to get this file");
  const url = URL.createObjectURL(b), a = document.createElement("a"); a.href = url;
  if (/^(image|text|video|audio)\/|pdf/.test(f.type)) a.target = "_blank"; else a.download = f.name;
  a.click(); setTimeout(() => URL.revokeObjectURL(url), 60000);

let actx;
function tone(notes){ try { actx ||= new AudioContext(); const t = actx.currentTime;
  notes.forEach(([f, d, v=.16]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t+d); g.gain.linearRampToValueAtTime(v, t+d+.01); g.gain.exponentialRampToValueAtTime(.001, t+d+.4);
    o.connect(g).connect(actx.destination); o.start(t+d); o.stop(t+d+.45); }); } catch(e){} }
const ding = () => tone([[880,0],[1318.5,.08]]);
const chime = () => tone([[659,0,.2],[880,.18,.2],[1046,.36,.2],[1318,.54,.18]]);

  if (state.settings.sound) chime();

    const opts = {body: t.due ? "Due " + dueLabel(t.due) : "My To-Do", tag:t.id, requireInteraction:true, icon:"icon-192.png"};
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification("Reminder: " + t.title, opts));
    else { const n = new Notification("Reminder: " + t.title, opts); n.onclick = () => { window.focus(); selId = t.id; renderAll(); n.close(); }; } } } catch(e){}
  const c = document.createElement("div"); c.className = "rcard"; c.dataset.id = t.id;
  c.innerHTML = `<div class="rh">${ic("bell")} Reminder</div><div class="rt">${esc(t.title)}</div><div class="rm">${esc(remLabel(t.reminder))}${t.due ? " · Due " + esc(dueLabel(t.due)) : ""}</div>
    <div class="rb"><button class="pri" data-r="done">Complete</button><button data-r="snooze">Snooze</button><button data-r="close">Dismiss</button></div>`;
  $("#rems").appendChild(c);

  clearInterval(flashT); let on = false; const base = document.title;

function buildMenu(items){

  for (const it of items) {
    if (!it) continue;

    if (it.header) { m.insertAdjacentHTML("beforeend", `<div class="mhdr">${esc(it.header)}</div>`); continue; }
    const sub = it.sub && it.sub.filter(Boolean), dis = it.disabled || (sub && !sub.length);
    const b = document.createElement("div"); b.className = "mi" + (it.danger ? " danger" : "") + (dis ? " dis" : "");
    b.innerHTML = `<span class="mic">${it.swatch ? `<i class="sw" style="background:${it.swatch}"></i>` : it.icon ? ic(it.icon) : ""}</span><span class="ml">${esc(it.label)}</span>${it.checked ? `<span class="mck">${ic("check")}</span>` : ""}${it.hint ? `<span class="mh">${esc(it.hint)}</span>` : ""}${sub && sub.length ? ic("chevr") : ""}`;

function dialog(title, body, {ok="Save", cancel="Cancel", danger=false, mount}={}){

    if (error) throw error;
    const remote = (data && data.data) || {};
    applyRemote(remote);
    const mine = docOf(state);
    if (!remote.tasks || canon(mine) !== canon(mergeDocs(remote, {tasks:[], lists:[], groups:[]}))) {
      const {error:e2} = await sb.from("todo_state").upsert({user_id:user.id, data:mine, updated_at:new Date().toISOString()});
      if (e2) throw e2;
    }
    lastSync = Date.now(); setSync("ok"); uploadPending();
  } catch(e) { console.warn("sync failed", e); setSync(navigator.onLine ? "error" : "offline"); }
  finally { syncing = false; if (again) { again = false; syncNow(); } }
}
function schedulePush(){ if (!sb || !user) return; clearTimeout(pushT); pushT = setTimeout(syncNow, 1000); }
async function uploadFile(rec, blob){
  if (!sb || !user || rec.cloud) return;
  const r = await sb.storage.from("todo-files").upload(`${user.id}/${rec.id}`, blob, {upsert:true, contentType:rec.type || "application/octet-stream"}).catch(e => ({error:e}));
  if (!r.error) { rec.cloud = true; save(); }
}
let uploading = false;
async function uploadPending(){
  if (uploading) return; uploading = true;
  try { for (const t of state.tasks) for (const f of t.files) if (!f.cloud) { const b = await fget(f.id).catch(() => null); if (b) await uploadFile(f, b); } }
  finally { uploading = false; }
}
function startSync(){
  if (chan) { sb.removeChannel(chan); chan = null; }
  if (!user) { setSync("off"); return; }
  chan = sb.channel("todo-" + user.id)
    .on("postgres_changes", {event:"*", schema:"public", table:"todo_state", filter:`user_id=eq.${user.id}`}, () => syncNow())
    .subscribe();
  syncNow();
}
async function initSync(){
  if (sb || !window.supabase) return;
  sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"mytodo-auth"}});
  const {data} = await sb.auth.getSession(); user = data.session ? data.session.user : null;
  sb.auth.onAuthStateChange((ev, s) => { const nu = s ? s.user : null; const changed = (nu && nu.id) !== (user && user.id); user = nu; if (changed) startSync(); else renderSyncBadge(); });
  renderSyncBadge(); startSync();
}
function loadSb(){
  if (window.supabase) return initSync();
  if (document.getElementById("sbjs")) return;
  const sc = document.createElement("script"); sc.id = "sbjs"; sc.src = SB_JS; sc.async = true;
  sc.onload = initSync; sc.onerror = () => { sc.remove(); renderSyncBadge(); };
  document.head.appendChild(sc);
}
async function accountDialog(msg){
  if (!sb) { loadSb(); return toast(navigator.onLine ? "Sync is still loading — try again in a moment." : "You're offline. Connect to the internet to sign in."); }
  if (user) {
    const f = await dialog("Sync", `<p>Signed in as <b>${esc(user.email)}</b></p><p>${lastSync ? "Last synced " + esc(fmtTime(new Date(lastSync))) + "." : ""} Your tasks sync automatically between every device where you sign in with this account.</p>`,
      {ok:"Sync now", cancel:"Close", mount: f => { const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Sign out"; b.style.marginRight = "auto";
        b.onclick = async () => { modalClose && modalClose(); await sb.auth.signOut(); toast("Signed out — your tasks stay on this device"); };
        f.querySelector(".dlg-f").prepend(b); }});
    if (f) syncNow(); return;
  }
  const f = await dialog("Sync with your phone", `
    <div class="authtabs"><label><input type="radio" name="mode" value="in" ${msg === "up" ? "" : "checked"}><span>Sign in</span></label><label><input type="radio" name="mode" value="up" ${msg === "up" ? "checked" : ""}><span>Create account</span></label></div>
    <label class="fld"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
    <label class="fld"><span>Password</span><input type="password" name="pw" required minlength="6" autocomplete="current-password"></label>
    <p style="font-size:12px">Use the same email and password on your PC and your phone.</p>
    ${msg && msg !== "up" ? `<div class="err">${esc(msg)}</div>` : ""}`, {ok:"Continue"});
  if (!f) return;
  const email = f.email.value.trim(), pw = f.pw.value, mode = f.mode.value;
  setSync("syncing");
  if (mode === "up") {
    const {data, error} = await sb.auth.signUp({email, password:pw});
    if (error) return accountDialog(error.message);
    if (!data.session) {
      await dialog("Confirm your email", `<p>We sent a confirmation link to <b>${esc(email)}</b>. Open it, then come back and sign in.</p><p>If the link opens a page that says it can't connect, that's fine — your account is still confirmed.</p>`, {ok:"OK", cancel:null});
      renderSyncBadge(); return;
    }
  } else {
    const {error} = await sb.auth.signInWithPassword({email, password:pw});
    if (error) return accountDialog(/confirm/i.test(error.message) ? "Please open the confirmation link we emailed you first." : error.message === "Invalid login credentials" ? "Wrong email or password." : error.message);
  }
  toast("Signed in — syncing your tasks");
}
$("#syncBtn").onclick = () => { if (user && syncStatus === "error") syncNow(); else accountDialog(); };
window.addEventListener("online", () => { loadSb(); syncNow(); });
window.addEventListener("offline", () => user && setSync("offline"));
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
setInterval(() => { if (!sb) loadSb(); else if (user && Date.now() - lastSync > 60000) syncNow(); }, 30000);

/* ---------- installable app (phone) ---------- */
let installEvt = null;
if (location.protocol === "https:") {
  const ml = document.createElement("link"); ml.rel = "manifest"; ml.href = "manifest.webmanifest"; document.head.appendChild(ml);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#installBtn").hidden = false; });
  $("#installBtn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("#installBtn").hidden = true; };
}

/* ---------- boot ---------- */
state = load();
if (!SMART[state.view] && !listById(state.view)) state.view = "myday";
if (state.view !== "myday" && SMART[state.view] && !state.settings.smart[state.view]) state.view = "myday";
$("#sideHamb").innerHTML = ic("menu"); $("#searchIc").innerHTML = ic("search");
$("#newListBtn").innerHTML = ic("plus") + "<span>New list</span>"; $("#newGroupBtn").innerHTML = ic("folderplus"); $("#settingsBtn").innerHTML = ic("gear");
resetSnap(); applyTheme(); renderAll(); writeLocal(); renderSyncBadge(); loadSb();
let lastDay = today();
setInterval(() => { checkReminders(); if (today() !== lastDay) { lastDay = today(); renderAll(); } }, 15000);
setTimeout(checkReminders, 1500);
setTimeout(fgc, 5000);
window.addEventListener("storage", e => { if (e.key === KEY) { state = load(); resetSnap(); renderAll(); } });
</script>
